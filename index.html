<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Your music. No ads. Works on your phone and your Mac.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Encore">
  <title>Encore</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <nav class="panel side-nav">
        <a class="brand" href="#/home" aria-label="Encore home"><span class="brand-mark"></span>Encore</a>
        <a class="side-link" href="#/home" data-nav="home"><span data-icon="home"></span>Home</a>
        <a class="side-link" href="#/search" data-nav="search"><span data-icon="search"></span>Search</a>
      </nav>
      <section class="panel side-lib">
        <header class="side-lib-head">
          <a class="side-link" href="#/library" data-nav="library"><span data-icon="library"></span>Your Library</a>
          <button class="icon-btn" data-action="new-playlist" title="Create playlist" aria-label="Create playlist"><span data-icon="plus"></span></button>
        </header>
        <div class="side-lib-list" id="sideLib"></div>
        <footer class="side-lib-foot">
          <button class="pill-btn" data-action="add-music"><span data-icon="upload"></span>Add music</button>
        </footer>
      </section>
    </aside>

    <main class="main panel" id="main">
      <div class="main-bg" id="mainBg"></div>
      <header class="topbar" id="topbar">
        <div class="topbar-bg"></div>
        <button class="round-btn" data-action="back" aria-label="Go back"><span data-icon="chevron-left"></span></button>
        <button class="round-btn desktop-only" data-action="forward" aria-label="Go forward"><span data-icon="chevron-right"></span></button>
        <div class="topbar-title" id="topbarTitle"></div>
        <div class="spacer"></div>
        <button class="pill-btn light" data-action="add-music"><span data-icon="upload"></span><span class="hide-sm">Add music</span></button>
      </header>
      <div class="view" id="view"></div>
    </main>

    <footer class="player" id="player" data-action="open-np-mobile">
      <div class="p-left">
        <button class="p-art" data-action="open-np" aria-label="Open now playing"><div class="art" id="pArt"></div></button>
        <div class="p-meta" data-action="open-np-mobile">
          <div class="p-title" id="pTitle">Nothing playing</div>
          <div class="p-artist" id="pArtist">Add some music to get started</div>
        </div>
        <button class="icon-btn like-btn" data-action="like-current" aria-label="Like"><span data-icon="heart"></span></button>
      </div>
      <div class="p-center">
        <div class="p-controls">
          <button class="icon-btn toggle" data-action="shuffle" aria-label="Shuffle"><span data-icon="shuffle"></span></button>
          <button class="icon-btn" data-action="prev" aria-label="Previous"><span data-icon="prev"></span></button>
          <button class="play-btn" data-action="toggle" aria-label="Play"><span data-icon="play"></span></button>
          <button class="icon-btn" data-action="next" aria-label="Next"><span data-icon="next"></span></button>
          <button class="icon-btn toggle" data-action="repeat" aria-label="Repeat"><span data-icon="repeat"></span></button>
        </div>
        <div class="p-progress">
          <span class="time" data-time="cur">0:00</span>
          <input type="range" class="range seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
          <span class="time" data-time="dur">0:00</span>
        </div>
      </div>
      <div class="p-right">
        <button class="icon-btn" data-action="nav" data-href="#/queue" aria-label="Queue" title="Queue"><span data-icon="queue"></span></button>
        <button class="icon-btn" data-action="mute" aria-label="Mute" title="Mute"><span data-icon="volume"></span></button>
        <input type="range" class="range volume" id="volume" min="0" max="100" value="80" aria-label="Volume">
        <button class="icon-btn" data-action="open-np" aria-label="Full screen" title="Now playing view"><span data-icon="expand"></span></button>
      </div>
      <div class="p-mini-progress"><div id="miniProgress"></div></div>
    </footer>

    <nav class="tabbar">
      <a href="#/home" data-nav="home"><span data-icon="home"></span>Home</a>
      <a href="#/search" data-nav="search"><span data-icon="search"></span>Search</a>
      <a href="#/library" data-nav="library"><span data-icon="library"></span>Your Library</a>
    </nav>
  </div>

  <section class="np" id="np" aria-hidden="true" aria-label="Now playing">
    <div class="np-bg" id="npBg"><div class="np-bg-shade"></div><div class="np-bg-grain"></div></div>
    <div class="np-inner" id="npInner">
      <header class="np-head">
        <button class="icon-btn" data-action="close-np" aria-label="Close"><span data-icon="chevron-down"></span></button>
        <div class="np-from" data-action="np-context">
          <small id="npFromType">Playing from</small>
          <strong id="npFromName"></strong>
        </div>
        <button class="icon-btn" data-action="menu-current" aria-label="More"><span data-icon="more"></span></button>
      </header>
      <div class="np-body">
        <div class="np-art-wrap" id="npArtWrap"><div class="art" id="npArt"></div></div>
        <div class="np-panel">
          <div class="np-info">
            <div class="np-text">
              <div class="np-title" id="npTitle"></div>
              <div class="np-artist" id="npArtist"></div>
            </div>
            <button class="icon-btn like-btn big" data-action="like-current" aria-label="Like"><span data-icon="heart"></span></button>
          </div>
          <div class="np-progress">
            <input type="range" class="range seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
            <div class="np-times"><span data-time="cur">0:00</span><span data-time="left">0:00</span></div>
          </div>
          <div class="np-controls">
            <button class="icon-btn toggle" data-action="shuffle" aria-label="Shuffle"><span data-icon="shuffle"></span></button>
            <button class="icon-btn xl" data-action="prev" aria-label="Previous"><span data-icon="prev"></span></button>
            <button class="play-btn xl" data-action="toggle" aria-label="Play"><span data-icon="play"></span></button>
            <button class="icon-btn xl" data-action="next" aria-label="Next"><span data-icon="next"></span></button>
            <button class="icon-btn toggle" data-action="repeat" aria-label="Repeat"><span data-icon="repeat"></span></button>
          </div>
          <div class="np-foot">
            <span class="np-badge"><span data-icon="check"></span>No ads, ever</span>
            <button class="icon-btn" data-action="np-queue" aria-label="Queue"><span data-icon="queue"></span></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="drop-overlay" id="dropOverlay"><div><span data-icon="upload"></span><h2>Drop to add to your library</h2><p>MP3, M4A, AAC, WAV, FLAC, OGG</p></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="layer"></div>

  <input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.oga,.opus,.webm" multiple hidden>
  <input type="file" id="folderInput" webkitdirectory multiple hidden>
  <audio id="audio" preload="auto" playsinline></audio>
</body>
</html>
